name: bnx-os
description: Mon système Fedora Kinoite optimisé avec KineticWE
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 40

modules:
  # 1. Dépôts requis pour Steam et KineticWE
  - type: rpm-ostree
    repos:
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-40.noarch.rpm
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-40.noarch.rpm
    copr:
      - linuxgamerlife/lgl-experimental

  # 2. Installation de vos paquets
  - type: rpm-ostree
    install:
      # Environnement
      - kineticwe
      
      # Base et terminaux (Sans PowerShell, isolé plus tard)
      - kitty
      - fish
      - neovim
      - stow
      - git
      
      # Gaming et optimisation matérielle
      - steam
      - gamemode
      - mangohud
      - steam-devices # Requis pour le volant Logitech G923

  # 3. Activation des services
  - type: systemd
    system:
      enabled:
        - docker.service # Prêt pour les services auto-hébergés

  # 4. Définir Fish comme shell par défaut
  - type: script
    snippets:
      - "chsh -s /usr/bin/fish"
