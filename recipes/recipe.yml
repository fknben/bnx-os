name: bnx-os
description: Mon système Fedora Kinoite optimisé avec KineticWE
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44

modules:
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/linuxgamerlife/lgl-experimental/repo/fedora-%OS_VERSION%/linuxgamerlife-lgl-experimental-fedora-%OS_VERSION%.repo
    
    install:
      - kineticwe
      - kitty
      - fish
      - neovim
      - stow
      - git
      - steam
      - gamemode
      - mangohud
      - steam-devices

  - type: systemd
    system:
      enabled:
        - docker.service

  - type: script
    snippets:
      - "chsh -s /usr/bin/fish"
