name: bnx-os
description: Mon système Fedora Kinoite (Pur) optimisé avec KineticWE
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  # MODULE 1 : Installation et configuration des dépôts externes
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/linuxgamerlife/lgl-experimental/repo/fedora-44/linuxgamerlife-lgl-experimental-fedora-44.repo
      - https://repo.librewolf.net/librewolf.repo
      - https://copr.fedorainfracloud.org/coprs/tofik/nwg-shell/repo/fedora-44/tofik-nwg-shell-fedora-44.repo
    install:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm

  # MODULE 2 : Nettoyage et résolution des conflits 32-bits (La clé pour Steam)
  - type: script
    snippets:
      # Met à jour la base pour éviter le décalage de versions 32/64 bits (ex: nss)
      - "dnf -y upgrade"
      # Remplace libcurl-minimal par libcurl complet (requis par Steam 32 bits)
      - "dnf -y swap libcurl-minimal libcurl --allowerasing"
      # Remplace la version free de ffmpeg par la version complète (RPM Fusion)
      - "dnf -y swap ffmpeg-free ffmpeg --allowerasing"
      # Retire Firefox installé par défaut pour utiliser Librewolf
      - "dnf -y remove firefox firefox-langpacks"

  # MODULE 3 : Installation des logiciels et plugins
  - type: rpm-ostree
    install:
      # Pilotes et plugins multimédias additionnels
      - mesa-va-drivers-freeworld
      - gstreamer1-plugins-bad-free-extras
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      
      # Navigateur natif
      - librewolf
      
      # Environnement et outils CLI
      - kineticwe
      - kitty
      - fish
      - neovim
      - stow
      - git
      
      # Moteur Docker natif et Compose
      - moby-engine
      - docker-compose
      
      # Theming et cohérence visuelle GTK/Qt
      - nwg-look
      - adw-gtk3-theme
      - qt5ct
      - qt6ct
      
      # Gaming natif (Steam RPM)
      - steam
      - gamemode
      - mangohud
      - steam-devices

  # MODULE 4 : Configuration des dépôts Flatpak (Flathub)
  - type: script
    snippets:
      - "flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"

  # MODULE 5 : Configuration système
  - type: script
    snippets:
      - "chsh -s /usr/bin/fish"

  # MODULE 6 : Services au démarrage
  - type: systemd
    system:
      enabled:
        - docker.service
