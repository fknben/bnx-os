name: bnx-os
description: Mon système Fedora Kinoite (Pur) optimisé avec KineticWE
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  # MODULE 1 : Installation et configuration des dépôts externes
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/linuxgamerlife/lgl-experimental/repo/fedora-44/linuxgamerlife-lgl-experimental-fedora-44.repo
      - https://repo.librewolf.net/librewolf.repo
    install:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm

  # MODULE 2 : Le nettoyage et les codecs (La méthode intelligente)
  # rpm-ostree est trop rigide pour échanger manuellement les bibliothèques multimédias.
  # On utilise dnf swap (autorisé lors du build) pour remplacer proprement ffmpeg-free et ses dépendances.
  - type: script
    snippets:
      - "dnf -y swap ffmpeg-free ffmpeg --allowerasing"
      - "dnf -y swap mesa-va-drivers mesa-va-drivers-freeworld --allowerasing"
      - "dnf -y remove firefox firefox-langpacks"

  # MODULE 3 : Installation des logiciels et plugins
  - type: rpm-ostree
    install:
      # Plugins multimédias additionnels
      - gstreamer1-plugins-bad-free-extras
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      
      # Navigateur natif
      - librewolf
      
      # Environnement et outils CLI
      - kineticwe
      - kitty
      - fish
      - neovim
      - stow
      - git
      
      # Theming et cohérence visuelle GTK/Qt
      - nwg-look
      - adw-gtk-theme
      - qt5ct
      - qt6ct
      
      # Gaming natif et optimisation
      - steam
      - gamemode
      - mangohud
      - steam-devices

  - type: systemd
    system:
      enabled:
        - docker.service

  - type: script
    snippets:
      - "chsh -s /usr/bin/fish"
