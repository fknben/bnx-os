name: bnx-os
description: Mon système Fedora Kinoite (Pur) optimisé avec KineticWE
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44

modules:
  - type: rpm-ostree
    repos:
      # Dépôt KineticWE
      - https://copr.fedorainfracloud.org/coprs/linuxgamerlife/lgl-experimental/repo/fedora-44/linuxgamerlife-lgl-experimental-fedora-44.repo
      # Dépôts RPM Fusion (nécessaires sur la base Kinoite pure pour Steam)
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm
      # Dépôt officiel LibreWolf
      - https://repo.librewolf.net/librewolf.repo
    
    remove:
      - firefox
      - firefox-langpacks

    install:
      # --- LE CORRECTIF MULTILIB ---
      - SDL3 # Force la synchronisation des versions 32-bits et 64-bits
      
      # Navigateur natif
      - librewolf
      
      # Environnement et outils CLI
      - kineticwe
      - kitty
      - fish
      - neovim
      - stow
      - git
      
      # Gaming natif et optimisation
      - steam
      - gamemode
      - mangohud
      - steam-devices

  - type: systemd
    system:
      enabled:
        - docker.service

  - type: script
    snippets:
      - "chsh -s /usr/bin/fish"
